name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
        python -m pip install --no-deps .
        driftmatrix validate --config driftmatrix_config/driftmatrix.example.json

    - name: Verify installed worker runtime outside checkout
      run: >-
        python -c "import os,tempfile,importlib; os.chdir(tempfile.mkdtemp()); modules=['desk_controls','desk_preferences','control_status','supervisor','supervisor_worker','utility_hub','now_playing_push','pc_stats_push','weather.weather_brief_push','weather.aqi_brief_push','drift_ecosystem']; loaded=[importlib.import_module(name) for name in modules]; import now_playing_push,drift_ecosystem; assert now_playing_push.SCRIPT_TEMPLATE_PATH.is_file(); assert drift_ecosystem.SCHEMA_PATH.is_file(); print('Installed runtime imports and resources verified')"

    - name: Install Linux display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth tk-dev

    - name: Run test suite (Linux virtual display)
      if: runner.os == 'Linux'
      run: xvfb-run -a python -m pytest -q -p no:cacheprovider

    - name: Run test suite (Windows)
      if: runner.os == 'Windows'
      run: python -m pytest -q -p no:cacheprovider

    - name: Verify installed host fleet outside checkout
      # Real worker loops; OS providers and upstream feeds use explicit fixtures.
      run: >-
        python -c "import os,tempfile,pathlib,importlib.metadata,pytest; checkout=pathlib.Path.cwd(); os.chdir(tempfile.mkdtemp(prefix='driftmatrix-installed-')); runtime=pathlib.Path(importlib.metadata.distribution('awtrix').locate_file('')).resolve(); assert runtime != checkout.resolve(); os.environ['DRIFTMATRIX_ACCEPTANCE_RUNTIME']=str(runtime); raise SystemExit(pytest.main([str(checkout/'test_real_host_fleet.py'),'-q','-s','-p','no:cacheprovider']))"
