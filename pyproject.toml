[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awtrix"
version = "1.0.0"
description = "PC-side senders and tools for an AWTRIX NG 32x8 LED panel"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.2,<8",
    "requests>=2.32,<3",
    "Pillow>=11.1,<12",
    "icalendar>=7.3,<8",
    "recurring-ical-events>=3.8,<4",
    "jsonschema>=4.23,<5",
    "pyserial>=3.5,<4",
    "winrt-Windows.Media.Control[all]==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management==3.2.1; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "numpy>=1.26,<3",
    "astropy>=6,<8",
]

[project.scripts]
driftmatrix = "driftmatrix:main"

[tool.setuptools]
packages = ["driftmatrix_config", "weather"]
py-modules = [
    "calendar_source", "commute_radar", "config_loader", "config_migration",
    "desk_companion", "desk_reminder", "drift_ecosystem", "drift_link_core", "driftmatrix",
    "focus_control", "focus_controller", "focus_sprint", "focus_sprint_preview",
    "game_mode", "github_sentinel", "hub_status", "icon_library", "iss_watch",
    "meeting_sentinel", "meridian_preview", "miku_sentinel", "network_sentinel",
    "network_sentinel_preview", "next_up", "next_up_controller", "next_up_preview",
    "nightkeeper_logic", "notify_mirror", "now_playing_bridge", "now_playing_push",
    "panel_client", "panel_down_alert", "panel_down_popup", "panel_gate", "panel_maintenance",
    "panel_scene", "pc_readouts", "pc_stats_preview", "pc_stats_push", "quake_watch",
    "runtime_paths", "sender_logging", "service_runtime", "sky_watch", "supervisor",
    "supervisor_worker", "utility_hub", "visual_system",
]

[tool.setuptools.package-data]
driftmatrix_config = ["*.json"]
weather = ["*.ax"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
markers = [
    "slow: tests that take more than 1 second",
    "integration: tests requiring network access or a live panel",
    "visual: tests that generate preview images",
]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["test_*", "*_preview.py", "*_preview_*.py", "conftest.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
